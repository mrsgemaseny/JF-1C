app = "zhanfinance"
primary_region = "ams"

[build]
dockerfile = "Dockerfile"

[env]
  SERVER_ADDRESS = "0.0.0.0"
  SERVER_PORT = "8080"
  SPRING_PROFILES_ACTIVE = "prod"
  JAVA_TOOL_OPTIONS = "-XX:MaxMetaspaceSize=256m -XX:MetaspaceSize=96m -Xmx384m -Xms256m"


[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]