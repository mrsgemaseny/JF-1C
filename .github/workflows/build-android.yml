name: Build Android APK (zhan-finance-android)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'zhan-finance-android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./zhan-finance-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./zhan-finance-android/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript & Unit Tests
        run: |
          npm run typecheck
          npm test

      - name: Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK via Gradle
        working-directory: ./zhan-finance-android/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhan-finance-android-release-apk
          path: ./zhan-finance-android/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
